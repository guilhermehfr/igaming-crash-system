services:
  postgres:
    image: postgres:18.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      POSTGRES_EXTRA_DATABASES: games,wallets,keycloak
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kong:
    image: kong:3.9.1
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      FRONTEND_URL: "http://localhost:5173"
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.dev.yml
      KONG_PLUGINS: "bundled"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./docker/kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  games:
    build:
      context: .
      dockerfile: ./services/games/Dockerfile
    command: ["bun", "run", "dev"]
    ports:
      - "4001:4001"
    volumes:
      - ./services/games/src:/app/services/games/src
      - ./packages:/app/packages
    env_file:
      - ./services/games/.env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4001/games/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  wallets:
    build:
      context: .
      dockerfile: ./services/wallets/Dockerfile
    command: ["bun", "run", "dev"]
    ports:
      - "4002:4002"
    volumes:
      - ./services/wallets/src:/app/services/wallets/src
      - ./packages:/app/packages
    env_file:
      - ./services/wallets/.env
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4002/wallets/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "5173:80"
    environment:
      VITE_PROXY_TARGET: http://kong:8000
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
    depends_on:
      kong:
        condition: service_healthy

  postgres_demo:
    image: postgres:18.3-alpine
    profiles: ["demo"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: crash_demo
    volumes:
      - postgres_demo_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crash_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo:
    build:
      context: .
      dockerfile: services/demo/Dockerfile
    profiles: ["demo"]
    ports:
      - "4003:4001"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres_demo:5432/crash_demo?sslmode=disable
      JWT_SECRET: demo-local-secret
      NODE_ENV: development
    depends_on:
      postgres_demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4001/games/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
  postgres_demo_data: